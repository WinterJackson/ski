<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ski Extension</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="popup-card" id="popup-card">
    <header>
      <div class="header-left">
        <span class="logo">⏭</span>
        <h1>Ski</h1>
      </div>
      <button id="open-options" class="icon-btn" title="Full settings" aria-label="Open full settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </header>

    <!-- Master Power Card (ON / OFF) -->
    <div class="power-card" id="power-card">
      <div class="power-header">
        <div class="power-status">
          <span class="status-indicator" id="status-indicator"></span>
          <div class="status-texts">
            <span class="power-title" id="power-title">Ski is Active</span>
            <span class="power-subtitle" id="power-subtitle">Ready to skip ads</span>
          </div>
        </div>
        <label class="switch master-switch" for="master-toggle" aria-label="Toggle Ski Extension On or Off">
          <input type="checkbox" id="master-toggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <p class="power-hint" id="power-hint">Press <kbd id="hotkey-display">Tab</kbd> during an ad to skip it</p>
    </div>

    <!-- Secondary Settings: Auto-Skip -->
    <div class="sub-section" id="sub-section">
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-label">Auto-Skip Ads</span>
          <span class="toggle-sublabel">Skip without keypress</span>
        </div>
        <label class="switch" for="auto-skip-toggle" aria-label="Toggle Auto-Skip">
          <input type="checkbox" id="auto-skip-toggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="stats-row" id="stats-row">
      <div class="stat">
        <span class="stat-value stat-accent" id="skip-count">0</span>
        <span class="stat-label">skipped</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value stat-success" id="time-saved">0s</span>
        <span class="stat-label">saved</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="today-count">0</span>
        <span class="stat-label">today</span>
      </div>
    </div>

    <footer>
      <span class="version">v<span id="version">1.0.0</span></span>
      <div class="footer-links">
        <a href="https://paystack.shop/pay/ski-extension" target="_blank" rel="noopener" class="donate-link" title="Support Ski Extension">☕ Support</a>
        <span class="footer-dot">·</span>
        <a href="#" id="full-settings">Settings →</a>
      </div>
    </footer>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
