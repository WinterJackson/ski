name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm compile

      - name: Run tests
        run: pnpm test

      - name: Build Chrome (MV3)
        run: pnpm build

      - name: Build Firefox (MV2)
        run: pnpm build:firefox

      - name: Zip Chrome
        run: pnpm zip

      - name: Zip Firefox
        run: pnpm zip:firefox

      - name: Upload Chrome zip
        uses: actions/upload-artifact@v4
        with:
          name: ski-extension-chrome-mv3
          path: .output/*.zip

      - name: Upload Firefox zip
        uses: actions/upload-artifact@v4
        with:
          name: ski-extension-firefox-mv2
          path: .output/*.zip

